<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>מעביר...</title>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        //
        // דף זה תמיד מוגש על ידי GitHub Pages כשמבקשים כתובת עמוקה שלא קיימת כקובץ אמיתי,
        // למשל https://xnet2.github.io/fny/topic/12 - הוא מפנה בחזרה ל-index.html
        // ומקודד בתוכו את הנתיב המקורי (topic/12), כדי שהאפליקציה תוכל לשחזר אותו.
        //
        // pathSegmentsToKeep = 1 כי זהו אתר פרויקט תחת xnet2.github.io/fny/ (שם הריפו "fny"
        // הוא ה-segment הראשון בנתיב שצריך להישאר קבוע).
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body>
</body>
</html>
